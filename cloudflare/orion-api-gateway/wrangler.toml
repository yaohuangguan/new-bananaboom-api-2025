name = "orion-api-gateway"
main = "src/index.js"
compatibility_date = "2026-09-24"
workers_dev = true
preview_urls = false

[vars]
# 0 disables automatic private-read migration; explicit canary remains available.
PRIVATE_POST_READ_ROLLOUT_PERCENT = 100
ORIGIN_URL = "https://bananaboom-api-242273127238.asia-east1.run.app"
# Off until authenticated E2E validates the Core Worker CRUD path.
# Then switch to 1 (all eligible JWT+idempotency requests).
ARTICLE_WRITE_CUTOVER = "0"
# Authenticated profile and AI-status reads require a real owner session parity
# check before global cutover. Explicit signed-in canary remains available.
PROFILE_READ_CUTOVER = "0"
# Authenticated Todo list GET only; keep writes and reminders unchanged.
TODO_READ_CUTOVER = "0"
# Footprint map/history GET read-only canary; all writes remain legacy.
FOOTPRINT_READ_CUTOVER = "0"
# Private by-ID detail GET; fail closed on owner-check failure. Google-only excluded.
FOOTPRINT_DETAIL_CUTOVER = "0"
# 0: old Cloud Run PDF, explicit x-orion-pdf-canary: 1 tests new Browser Run.
# Switch to 1 only after a production PDF is generated and inspected.
PDF_BROWSER_CUTOVER = "1"
# Production R2 database backup verified on 2026-11-07:
# normal admin request + all private chunk SHA-256 + isolated restore passed.
# Set to 0 only for a controlled rollback to Cloud Run backup.
BACKUP_R2_CUTOVER = "1"

[[routes]]
pattern = "api.samyao.me"
custom_domain = true

[[ratelimits]]
name = "GENERAL_LIMITER"
namespace_id = "12001"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "12002"
  [ratelimits.simple]
  limit = 60
  period = 60

# Legacy likes rate limit: 30 requests per client IP per minute.
[[ratelimits]]
name = "LIKE_LIMITER"
namespace_id = "12005"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "12003"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "EXPENSIVE_LIMITER"
namespace_id = "12004"
  [ratelimits.simple]
  limit = 12
  period = 60


[[services]]
binding = "BANANABOOM_CORE"
service = "bananaboom-core"

# Browser Run (free daily allowance) renders only the public Orion resume page.
[browser]
binding = "BROWSER"
