name = "bananaboom-core"
main = "src/index.js"
compatibility_date = "2026-11-05"
workers_dev = false
preview_urls = false

# Standalone origin during migration. Production api.samyao.me stays on Gateway.
# Secret: MONGO_URI, configure with wrangler secret put.

[vars]
R2_PUBLIC_DOMAIN = "https://assets.samyao.me"

[[durable_objects.bindings]]
name = "MONGODB_CONNECTION"
class_name = "MongoDBConnection"

[[migrations]]
tag = "mongodb-connection-v1"
new_sqlite_classes = ["MongoDBConnection"]
