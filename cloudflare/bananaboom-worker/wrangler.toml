name = "bananaboom-core"
main = "src/index.js"
compatibility_date = "2026-11-05"
workers_dev = false
preview_urls = false

# Standalone origin during migration. Production api.samyao.me stays on Gateway.
# Secret: MONGO_URI, configure with wrangler secret put.

[vars]
R2_PUBLIC_DOMAIN = "https://assets.samyao.me"
# Existing GCP Todo job is paused: do not send until separately enabled.
TODO_REMINDERS_ENABLED = "0"

[[durable_objects.bindings]]
name = "MONGODB_CONNECTION"
class_name = "MongoDBConnection"

[[migrations]]
tag = "mongodb-connection-v1"
new_sqlite_classes = ["MongoDBConnection"]

# Durable post-operation notifications. Worker-only scheduled invocation.
[triggers]
crons = ["* * * * *"]

# Never bind this bucket to a public domain. Contains passwords, sessions,
# access tokens and private notes in recoverable BSON-compatible form.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "orion-private-db-backups"
